#lw .lw-photo{position:relative;height:clamp(120px,23vh,210px);display:flex;align-items:center;justify-content:center;margin:8px 0 4px}
#lw .lw-photo::before{content:"";position:absolute;left:50%;top:50%;width:min(330px,62%);aspect-ratio:1/1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,var(--pc),transparent 72%);opacity:.55}
#lw .lw-photo img,#lw .lw-photo svg{position:relative;max-height:100%;max-width:74%;object-fit:contain;filter:drop-shadow(0 26px 30px rgba(3,5,40,.55));animation:lwIn .7s cubic-bezier(.2,1.6,.4,1) both,lwFloat 3.4s ease-in-out .7s infinite}
#lw .lw-photo svg{height:78%;width:auto}
#lw .lw-photo .lw-tk{position:relative;display:inline-flex;align-items:center;justify-content:center;padding:18px 38px;border-radius:26px;background:var(--lime);font-size:clamp(56px,7vw,86px);box-shadow:0 22px 44px rgba(3,5,40,.45);animation:lwIn .7s cubic-bezier(.2,1.6,.4,1) both,lwFloat 3.4s ease-in-out .7s infinite}
#lw .lw-photo .lw-sad{color:#c9d0f5}
#lw .lw-card.is-lose{background:linear-gradient(180deg,#3b4390,#191e5c);border-color:rgba(255,255,255,.18)}
#lw .lw-card.is-giam10{border-color:rgba(212,255,58,.6)}
@keyframes lwIn{0%{transform:scale(.4) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes lwFloat{50%{transform:translateY(-8px)}}
#lw .lw-name{margin:2px 0 6px;font-family:var(--fd);font-weight:800;font-size:clamp(24px,3vw,34px);line-height:1.12;letter-spacing:-.01em;color:#fff}
#lw .lw-note{margin:0 0 14px;color:var(--ice);font-size:16px}
#lw .lw-note b{color:#fff}
#lw .lw-pick{margin:0 0 16px}
#lw .lw-pick p{margin:0 0 9px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
#lw .lw-chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
#lw .lw-chip{padding:6px 13px 6px 6px!important;border-radius:999px!important;background:rgba(255,255,255,.1)!important;border:1px solid rgba(255,255,255,.2)!important;color:#fff!important;font-size:14.5px;font-weight:700;transition:transform .12s,background .2s,box-shadow .2s}
#lw .lw-chip:active{transform:scale(.96)}
#lw .lw-chip.is-on{background:var(--lime)!important;border-color:transparent!important;color:var(--ink)!important;box-shadow:0 8px 22px rgba(212,255,58,.3)}
#lw .lw-chip:disabled{opacity:.3}
#lw .lw-sw{display:inline-flex;align-items:center;gap:8px}
#lw .lw-sw img{width:30px;height:30px;object-fit:contain}
#lw .lw-sw i{width:22px;height:22px;margin:4px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.55)}
#lw .lw-sw em{font-style:normal;opacity:.7;font-weight:400}
#lw .lw-done{position:relative;padding:17px 34px!important;border-radius:18px!important;background:var(--lime)!important;color:var(--ink)!important;font-family:var(--fd)!important;font-weight:800!important;font-size:17px!important;letter-spacing:.02em;box-shadow:0 6px 0 var(--lime-d),0 16px 30px rgba(212,255,58,.25)!important}
#lw .lw-done:disabled{background:rgba(255,255,255,.12)!important;color:rgba(255,255,255,.5)!important;box-shadow:none!important}
#lw .lw-admin{width:min(980px,100%);max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:24px;padding:22px 24px;background:#f5f7fb;color:#0b1a31;text-align:left;user-select:text;-webkit-user-select:text}
#lw .lw-admin h2{margin:0 0 2px;font-size:21px;font-weight:800;color:#0b1a31;letter-spacing:-.01em}
#lw .lw-admin h3{margin:16px 0 6px;font-size:15px;font-weight:800;color:#0b1a31}
#lw .lw-admin p{margin:0 0 10px;color:#55657a;font-size:14px}
#lw .lw-tabs{display:flex;gap:6px;margin:12px 0 6px;padding:4px;border-radius:14px;background:#e6ebf3;width:max-content;max-width:100%;overflow:auto}
#lw .lw-tab{padding:9px 14px!important;border-radius:10px!important;font-weight:700;font-size:14px;color:#3b4a5f!important}
#lw .lw-tab.is-on{background:#fff!important;color:#0b1a31!important;box-shadow:0 2px 8px rgba(11,26,49,.12)}
#lw .lw-admin table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 14px;background:#fff;border-radius:14px;overflow:hidden}
#lw .lw-admin th,#lw .lw-admin td{padding:9px 11px;border-bottom:1px solid #e6ebf3;text-align:left;vertical-align:middle;color:#0b1a31;background:transparent}
#lw .lw-admin th{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#6a7a90;background:#fafbfd}
#lw .lw-admin td.num,#lw .lw-admin th.num{text-align:right}
#lw .lw-plus{color:#178a4a;font-weight:800}
#lw .lw-minus{color:#c8322a;font-weight:800}
#lw .lw-tag{display:inline-block;white-space:nowrap;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#e6ebf3;color:#3b4a5f}
#lw .lw-tag.is-void{background:#fde3e1;color:#a3271f}
#lw .lw-tag.is-test{background:#fff1d6;color:#7a5200}
#lw .lw-swatch{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:7px;vertical-align:-1px;box-shadow:0 0 0 1px rgba(11,26,49,.25)}
#lw .lw-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 12px}
#lw .lw-btn{padding:10px 14px!important;border-radius:12px!important;background:#0b1a31!important;color:#fff!important;font-weight:700;font-size:14px}
#lw .lw-btn.is-soft{background:#e3e9f2!important;color:#0b1a31!important}
#lw .lw-btn.is-red{background:#fde3e1!important;color:#a3271f!important}
#lw .lw-mini{width:34px;height:34px;border-radius:10px!important;background:#e3e9f2!important;color:#0b1a31!important;font-weight:800}
#lw .lw-num{width:84px;padding:8px 10px;border-radius:10px;border:1px solid #c9d3e0;font-size:15px;color:#0b1a31;background:#fff}
#lw .lw-text{width:220px;padding:8px 10px;border-radius:10px;border:1px solid #c9d3e0;font-size:15px;color:#0b1a31;background:#fff}
#lw .lw-color{width:44px;height:36px;padding:0;border:0;background:none}
#lw .lw-pin{display:flex;gap:10px;justify-content:center;margin:14px 0}
#lw .lw-pin input{width:180px;padding:12px 14px;border-radius:12px;border:1px solid #c9d3e0;font-size:22px;text-align:center;letter-spacing:.3em;color:#0b1a31;background:#fff}
#lw .lw-err{color:#c8322a!important;text-align:center}
#lw .lw-confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
@media (orientation:portrait){#lw .lw-stage{width:min(86vw,calc(100vh - 200px))}#lw .lw-mark{font-size:44vw}#lw .lw-days .lw-day{width:34px;height:34px;font-size:13px}}
@media (prefers-reduced-motion:reduce){#lw .lw-bg i,#lw .lw-bokeh b,#lw .lw-burst,#lw .lw-fly,#lw .lw-leds g,#lw .lw-cap.is-ready::after,#lw .lw-rays,#lw .lw-photo img,#lw .lw-photo svg,#lw .lw-card.is-hub .lw-tier,#lw .lw-hist-list li.is-new,#lw .lw-hist{animation:none}}
</style>
</head>

      "<input id=\"lwGiftImg\" type=\"file\" accept=\"image/*\">" +
      "<button class=\"lw-btn\" type=\"button\" data-act=\"addgift\">Thêm quà</button></div>" +
      "<p>Quà thêm vào nhóm “quà khác”, số suất mặc định = số lượng nhập. Ảnh nên chụp trên nền trắng. Quà đã trao thì chỉ ẩn được, không xóa.</p>";
  }
  function stockHtml() {
    return stockKeys(state).map(function (k) {
      var rows = variantsOf(k, state).map(function (v) {
        var key = esc(k + "|" + v.id);
        return "<tr><td>" + swatch(v) + esc(v.name) + "</td><td class=\"num lw-plus\">" + sumKind(k, v.id, "nhap") + "</td><td class=\"num lw-minus\">" + (-sumKind(k, v.id, "trao") - sumKind(k, v.id, "hoantac")) +
          "</td><td class=\"num\">" + sumKind(k, v.id, "dieuchinh") + "</td><td class=\"num\"><b>" + ledgerSum(state, k, v.id) + "</b></td><td>" +
          "<input class=\"lw-num\" type=\"number\" inputmode=\"numeric\" min=\"1\" placeholder=\"SL\" id=\"lwIn-" + key + "\"> " +
          "<button class=\"lw-btn\" type=\"button\" data-act=\"in\" data-k=\"" + key + "\">Nhập</button> " +
          "<button class=\"lw-btn is-red\" type=\"button\" data-act=\"out\" data-k=\"" + key + "\">Bớt 1</button></td></tr>";
      }).join("");
      var add = k === "yoyo" ? "<div class=\"lw-row\"><input class=\"lw-text\" id=\"lwNewName\" placeholder=\"Tên màu mới (vd Xanh băng)\"><input class=\"lw-color\" id=\"lwNewSwatch\" type=\"color\" value=\"#8fb8e8\"><button class=\"lw-btn is-soft\" type=\"button\" data-act=\"addcolour\">Thêm màu</button></div>" : "";
      return "<h3>" + esc(prizeOf(k).name) + " · còn " + Math.max(0, leftOf(k, state)) + "</h3><table><thead><tr><th>Màu / loại</th><th class=\"num\">Đã nhập</th><th class=\"num\">Đã trao</th><th class=\"num\">Điều chỉnh</th><th class=\"num\">Còn</th><th>Nhập thêm / bớt</th></tr></thead><tbody>" + rows + "</tbody></table>" + add;
    }).join("") + "<p>“Bớt 1” dùng khi quà lỗi, thất lạc hoặc lấy ra ngoài chương trình · mọi thay đổi đều vào Lịch sử kho.</p>";
  }
  function historyHtml() {
    var bal = {};
    var rows = state.ledger.map(function (e) {
      var key = e.prize + "|" + e.variant;
      bal = assign(bal, (function () { var o = {}; o[key] = (bal[key] || 0) + e.qty; return o; })());
      return { e: e, after: bal[key] };
    }).reverse().map(function (x) {
      var v = variantOf(x.e.prize, x.e.variant, state);
      return "<tr><td>" + esc(timeText(x.e.t)) + "</td><td><span class=\"lw-tag\">" + esc(CFG.kinds[x.e.kind] || x.e.kind) + "</span></td><td>" + esc(prizeOf(x.e.prize).name) + "</td><td>" + swatch(v) + esc(v.name) +
        "</td><td class=\"num " + (x.e.qty > 0 ? "lw-plus" : "lw-minus") + "\">" + (x.e.qty > 0 ? "+" : "") + x.e.qty + "</td><td class=\"num\"><b>" + x.after + "</b></td><td>" + esc(x.e.note || "") + "</td></tr>";
    }).join("") || "<tr><td colspan=\"7\">Chưa có thay đổi kho.</td></tr>";
    return "<table><thead><tr><th>Thời gian</th><th>Loại</th><th>Quà</th><th>Màu / loại</th><th class=\"num\">SL</th><th class=\"num\">Tồn sau</th><th>Ghi chú</th></tr></thead><tbody>" + rows + "</tbody></table>";
  }
  function spinsHtml() {
    var rows = state.spins.slice().reverse().map(function (x) {
      var v = x.variant ? variantOf(x.prize, x.variant, state) : null;
      var tag = x.void ? "<span class=\"lw-tag is-void\">Đã hoàn tác</span>" : (x.test ? "<span class=\"lw-tag is-test\">Content</span>" : (x.variant ? "" : "<span class=\"lw-tag is-test\">Chờ chọn màu</span>"));
      return "<tr><td>" + esc(timeText(x.t)) + "</td><td>" + esc(prizeOf(x.prize).name) + "</td><td>" + (v ? swatch(v) + esc(v.name) : "—") + "</td><td>" + tag + "</td></tr>";
    }).join("") || "<tr><td colspan=\"4\">Chưa có lượt quay.</td></tr>";
    return "<table><thead><tr><th>Thời gian</th><th>Quà</th><th>Màu / loại</th><th></th></tr></thead><tbody>" + rows + "</tbody></table>";
  }
  function renderAdmin() {
    var tabs = [["overview", "Tổng quan"], ["gifts", "Kế hoạch quà"], ["stock", "Tồn kho"], ["history", "Lịch sử kho"], ["spins", "Lượt quay"]];
    var body = { overview: overviewHtml, gifts: giftsHtml, stock: stockHtml, history: historyHtml, spins: spinsHtml }[admin.tab]();
    el.admin.innerHTML = "<h2>Quản lý vòng quay 11.11</h2><p>Hôm nay " + shortDay(today()) + " · đã quay " + liveSpins(state).length + " lượt</p><div class=\"lw-tabs\">" + tabs.map(function (t) {
        return "<button class=\"lw-tab" + (admin.tab === t[0] ? " is-on" : "") + "\" type=\"button\" data-act=\"tab\" data-tab=\"" + t[0] + "\">" + t[1] + "</button>";
      }).join("") + "</div>" + (admin.msg ? "<p class=\"lw-err\">" + esc(admin.msg) + "</p>" : "") + body +
      "<div class=\"lw-row\"><button class=\"lw-btn\" type=\"button\" data-act=\"csvspins\">CSV lượt quay</button><button class=\"lw-btn\" type=\"button\" data-act=\"csvstock\">CSV lịch sử kho</button><button class=\"lw-btn is-soft\" type=\"button\" data-act=\"close\">Đóng</button></div>";
  }
  function csvOf(rows) {
    return rows.map(function (r) { return r.map(function (v) { return "\"" + String(v).replace(/"/g, "\"\"") + "\""; }).join(","); }).join("\r\n");
  }
  function download(name, text) {
    try {
      var blob = new Blob(["﻿" + text], { type: "text/csv;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    } catch (e) { warn("Không xuất được CSV trên máy này"); }
  }
  function csvSpins() {
    return csvOf([["STT", "Thời gian", "Ngày", "Giải", "Quà", "Màu / loại", "Trạng thái"]].concat(state.spins.filter(function (x) { return !x.test; }).map(function (x, i) {
      var p = prizeOf(x.prize);
      return [i + 1, timeText(x.t), shortDay(x.day), p.tier, p.name, x.variant ? variantOf(x.prize, x.variant, state).name : "",
              x.void ? "Đã hoàn tác" : "Chính thức"];
    })));
  }
  function csvStock() {
    var bal = {};
    return csvOf([["Thời gian", "Loại", "Quà", "Màu / loại", "Số lượng", "Tồn sau", "Ghi chú"]].concat(state.ledger.map(function (e) {
      var key = e.prize + "|" + e.variant;
      bal = assign(bal, (function () { var o = {}; o[key] = (bal[key] || 0) + e.qty; return o; })());
      return [timeText(e.t), CFG.kinds[e.kind] || e.kind, prizeOf(e.prize).name, variantOf(e.prize, e.variant, state).name, e.qty, bal[key], e.note || ""];
    })));
  }
  function stockEntry(prize, vid, qty, kind, note) {
    return { id: "s-" + Date.now() + "-" + Math.floor(Math.random() * 1000), t: nowIso(), prize: prize, variant: vid, qty: qty, kind: kind, note: note };
  }
  function undoLast() {
    var last = state.spins.filter(function (x) { return !x.void && !x.test; }).slice(-1)[0];
    if (!last) { return state; }
    var back = last.variant && !last.test ? [stockEntry(last.prize, last.variant, 1, "hoantac", "Hoàn tác lượt quay " + timeText(last.t))] : [];
    return assign(state, { spins: state.spins.map(function (x) { return x.id === last.id ? assign(x, { void: true }) : x; }), ledger: state.ledger.concat(back) });
  }
  /* Ảnh quà thêm: thu về tối đa 360 px rồi lưu cùng dữ liệu trên iPad. */
  function readPhoto(file, done) {
    if (!file || !window.FileReader) { done(""); return; }
    var reader = new FileReader();
    reader.onerror = function () { done(""); };
    reader.onload = function () {
      var im = new Image();
      im.onerror = function () { done(""); };
      im.onload = function () {
        var k = Math.min(1, 360 / Math.max(im.naturalWidth, im.naturalHeight));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        try { done(c.toDataURL(file.type === "image/png" ? "image/png" : "image/jpeg", 0.86)); } catch (e) { done(""); }
      };
      im.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  function addGift() {
    var name = ((($("lwGiftName") || {}).value) || "").trim().slice(0, 40);
    var qty = Math.floor(Number(($("lwGiftQty") || {}).value));
    var perDay = 0;
    if (!name || !(qty > 0 && 10000 > qty)) { admin = assign(admin, { msg: "Nhập tên quà và số lượng (1–9999)" }); renderAdmin(); return; }
    var input = $("lwGiftImg");
    readPhoto(input && input.files ? input.files[0] : null, function (img) {
      var gift = { id: "c" + Date.now(), name: name, perDay: perDay, img: img, hidden: false };
      persist(assign(state, { custom: (state.custom || []).concat([gift]),
                              ledger: state.ledger.concat([stockEntry(gift.id, "x", qty, "nhap", "Thêm quà mới trên iPad")]) }));
      admin = assign(admin, { msg: ui.saveError ? "Không lưu được (ảnh quá lớn hoặc Safari duyệt riêng tư)" : "" });
      rebuildWheel();
      loadImages(function () { buildStickers(); drawWheel(); });
      render();
      renderAdmin();
    });
  }
  function adminAction(act, b) {
    var parts = (b.getAttribute("data-k") || "").split("|");
    admin = assign(admin, { msg: "" });
    if (act === "tab") { admin = assign(admin, { tab: b.getAttribute("data-tab") }); }
    else if (act === "addgift") { addGift(); return; }
    else if (act === "savequota") {
      var q = giftKeys(state).reduce(function (acc, k) {
        var input = $("lwQ-" + k);
        var o = {}; o[k] = clampNum(input && input.value, 0, 999, quotaOf(k, state)); return assign(acc, o);
      }, {});
      persist(assign(state, { quota: q }));
    } else if (act === "resetquota") { persist(assign(state, { quota: {} })); }
    else if (act === "saveset") {
      persist(assign(state, { settings: { lose: clampNum(($("lwSetLose") || {}).value, 0, 50, state.settings.lose),
                                          yoyo: clampNum(($("lwSetYoyo") || {}).value, 0, 100, state.settings.yoyo) } }));
    } else if (act === "hidegift") {
      persist(assign(state, { custom: state.custom.map(function (c) { return c.id === parts[0] ? assign(c, { hidden: !c.hidden }) : c; }) }));
      rebuildWheel();
    } else if (act === "delgift") {
      if (givenOf(parts[0], state)) { return; }
      persist(assign(state, { custom: state.custom.filter(function (c) { return c.id !== parts[0]; }),
                              ledger: state.ledger.filter(function (e) { return e.prize !== parts[0]; }) }));
      rebuildWheel();
    }
    else if (act === "exp") { persist(assign(state, { expected: Math.min(200, Math.max(1, state.expected + Number(b.getAttribute("data-d")))) })); }
    else if (act === "in") {
      var input = $("lwIn-" + parts[0] + "|" + parts[1]);
      var n = Math.floor(Number(input && input.value));
      if (!(n > 0 && 10000 > n)) { return; }
      persist(assign(state, { ledger: state.ledger.concat([stockEntry(parts[0], parts[1], n, "nhap", "Nhập kho trên iPad")]) }));
    } else if (act === "out") {
      if (0 >= ledgerSum(state, parts[0], parts[1])) { return; }
      persist(assign(state, { ledger: state.ledger.concat([stockEntry(parts[0], parts[1], -1, "dieuchinh", "Bớt 1: lỗi / thất lạc / lấy ra")]) }));
    } else if (act === "addcolour") {
      var name = ($("lwNewName") || {}).value || "";
      if (!name.trim()) { return; }
      var colour = { id: "c" + Date.now(), name: name.trim().slice(0, 40), swatch: ($("lwNewSwatch") || {}).value || "#8fb8e8", qty: 0 };
      persist(assign(state, { extra: assign(state.extra, { yoyo: ((state.extra && state.extra.yoyo) || []).concat([colour]) }) }));
    } else if (act === "undo") {
      if (!admin.undoArmed) {
        admin = assign(admin, { undoArmed: true });
        setTimeout(function () { admin = assign(admin, { undoArmed: false }); if (admin.open && admin.tab === "overview") { renderAdmin(); } }, 4000);
      } else { admin = assign(admin, { undoArmed: false }); persist(undoLast()); }
    } else if (act === "resetall") {
      if (!admin.resetArmed) {
        admin = assign(admin, { resetArmed: true });
        setTimeout(function () { admin = assign(admin, { resetArmed: false }); if (admin.open && admin.tab === "overview") { renderAdmin(); } }, 4000);
      } else {
        /* Xóa mọi lượt quay + dòng trao quà / hoàn tác trong sổ kho; giữ nhập kho, điều chỉnh, quà thêm, suất. */
        admin = assign(admin, { resetArmed: false });
        persist(assign(state, { spins: [], ledger: state.ledger.filter(function (e) { return e.kind !== "trao" && e.kind !== "hoantac"; }) }));
        ui = assign(ui, { lastId: null });
      }
    }
    else if (act === "mute") { persist(assign(state, { muted: !state.muted })); }
    else if (act === "csvspins") { download("vong-quay-11-11_luot-quay_" + today() + ".csv", csvSpins()); }
    else if (act === "csvstock") { download("vong-quay-11-11_lich-su-kho_" + today() + ".csv", csvStock()); }
    render();
    renderAdmin();
  }
  function tryPin() {
    var input = $("lwPinInput");
    if (admin.pendingMode) {
      if (!input || input.value !== CFG.pin) { openModePin(admin.pendingMode, "Sai mã PIN"); return; }
      persist(assign(state, { mode: admin.pendingMode }));
      admin = assign(admin, { pendingMode: null });
      el.adminLayer.hidden = true;
      ui = assign(ui, { lastId: null });
      render();
      return;
    }
    if (input && input.value === CFG.pin) { admin = assign(admin, { open: true, tab: "overview" }); renderAdmin(); } else { openPin("Sai mã PIN"); }
  }

  /* ---------- khởi động + sự kiện ---------- */
  var state = loadState();
  var ui = { spinning: false, revealing: false, resultId: null, pick: null, lastId: null, ledgerBefore: 0, saveError: false };
  SEGS = segmentsOf(state);
  SEG = 360 / SEGS.length;
  el.card.addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("[data-pick],[data-act]") : null;
    if (!b || b.disabled) { return; }
    if (b.hasAttribute("data-pick")) { choosePick(b.getAttribute("data-pick")); return; }
    if (b.getAttribute("data-act") === "done") { finishResult(); }
  });
  el.cap.addEventListener("click", spin);
  el.histBtn.addEventListener("click", function () { if (!ui.spinning && !ui.revealing) { setHist(el.histPanel.hidden); } });
  el.root.addEventListener("click", function (ev) {
    if (el.histPanel.hidden || el.histPanel.contains(ev.target) || el.histBtn.contains(ev.target)) { return; }
    setHist(false);
  }, true);
  el.mode.addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("[data-mode]") : null;
    if (!b || b.disabled || ui.spinning || ui.revealing) { return; }
    var mode = b.getAttribute("data-mode");
    if (mode === (isTest(state) ? "content" : "event")) { return; }
    openModePin(mode, "");
  });
  el.brand.addEventListener("click", function () {
    var now = Date.now();
    taps = taps.filter(function (t) { return 3000 > now - t; }).concat([now]);
    if (taps.length >= 5) { taps = []; openPin(""); }
  });
  el.admin.addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("[data-act]") : null;
    if (!b) { return; }
    var act = b.getAttribute("data-act");
    if (act === "close") { el.adminLayer.hidden = true; admin = assign(admin, { open: false, pendingMode: null }); return; }
    if (act === "pin") { tryPin(); return; }
    if (admin.open) { adminAction(act, b); }
  });
  el.admin.addEventListener("keydown", function (ev) { if (ev.key === "Enter" && !admin.open) { tryPin(); } });
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") { wakeLock = null; render(); } });
  window.addEventListener("resize", drawWheel);
  el.root.addEventListener("scroll", function () { if (el.root.scrollTop || el.root.scrollLeft) { el.root.scrollTop = 0; el.root.scrollLeft = 0; } });
  document.documentElement.classList.add("lw-on");
  document.body.classList.add("lw-on");
  buildLeds();
  buildBokeh();
  Array.prototype.forEach.call(el.root.querySelectorAll("[data-img]"), function (im) { im.src = IMG[im.getAttribute("data-img")] || ""; });
  drawWheel();
  loadImages(function () { buildStickers(); drawWheel(); });
  /* Chữ trên vành vẽ bằng canvas: vẽ lại khi font nhúng đã sẵn sàng. */
  try {
    if (document.fonts && document.fonts.load) {
      Promise.all([document.fonts.load("800 20px \"LW Text\""), document.fonts.load("800 20px \"LW Display\"")]).then(drawWheel, drawWheel);
    }
  } catch (e) { drawWheel(); }
  render();
  window.requestAnimationFrame(idleFrame);
  var pending = state.spins.filter(needsPick).slice(-1)[0];
  if (pending) { ui = assign(ui, { resultId: pending.id, pick: defaultPick(pending) }); renderResult(); }
  if (DEBUG) {
    window.__lw = { CFG: CFG, pickPrize: pickPrize, pickColour: pickColour, allowance: allowance, plannedUpTo: plannedUpTo, seedState: seedState,
                    leftOf: leftOf, prizeOf: prizeOf, waveNo: waveNo, quotaLeft: quotaLeft, segments: function () { return SEGS; }, getState: function () { return state; } };
  }
})();
</script>
</body>
</html>
