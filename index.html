  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased
}
#tc *{box-sizing:border-box}
:where(#tc) button{font:inherit;color:inherit;border:0;margin:0;padding:0;background:none;cursor:pointer;touch-action:manipulation;line-height:1.2}
#tc input{font:inherit;margin:0}
:where(#tc) img{max-width:none;border:0;-webkit-user-drag:none}
#tc [hidden]{display:none!important}

/* ---------- nền ---------- */
.tc-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;background:radial-gradient(120% 80% at 50% 100%,#15130f 0%,#0a0a0d 45%,#07070a 75%)}
.tc-glow{position:absolute;left:50%;top:-30vh;width:120vw;height:80vh;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(242,193,78,.16),rgba(242,193,78,.04) 55%,transparent);animation:tcBreath 9s ease-in-out infinite alternate}
.tc-spot{position:absolute;left:50%;bottom:-18vh;width:90vw;height:70vh;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(255,226,160,.09),transparent 72%)}
.tc-mark{position:absolute;left:50%;bottom:-2.4vw;transform:translateX(-50%);white-space:nowrap;font-family:var(--fd);font-weight:800;font-size:15.5vw;line-height:1;letter-spacing:-.02em;color:transparent;-webkit-text-stroke:1px rgba(242,193,78,.075)}
.tc-vignette{position:absolute;inset:0;background:radial-gradient(130% 100% at 50% 45%,transparent 55%,rgba(0,0,0,.55))}
.tc-motes i{position:absolute;bottom:-4vh;width:var(--s);height:var(--s);border-radius:50%;background:#ffe7a3;box-shadow:0 0 6px rgba(242,193,78,.8);opacity:0;animation:tcMote var(--t) linear infinite;animation-delay:var(--d)}
@keyframes tcMote{0%{transform:translate3d(0,0,0);opacity:0}12%{opacity:var(--o)}85%{opacity:var(--o)}100%{transform:translate3d(var(--x),-108vh,0);opacity:0}}
@keyframes tcBreath{to{opacity:.65;transform:translateX(-50%) scale(1.08)}}

/* ---------- đầu trang ---------- */
.tc-head{position:absolute;z-index:6;top:0;left:0;right:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  grid-template-areas:"brand event tools";column-gap:14px;align-items:center;
  padding:max(12px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) 6px max(24px,env(safe-area-inset-left))}
.tc-brand{grid-area:brand;position:relative;display:grid;place-items:center;width:46px;height:52px;border-radius:14px;-webkit-touch-callout:none}
.tc-logo{display:block;width:30px;height:46px;background:var(--gold-grad);background-size:220% 100%;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;filter:drop-shadow(0 2px 8px rgba(242,193,78,.25))}
.tc-brand.is-holding .tc-logo{opacity:.55;transition:opacity 2s linear}
.tc-brand.is-content::after{content:"";position:absolute;right:2px;bottom:4px;width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:.85}
.tc-event{grid-area:event;margin:0;align-self:center;display:flex;align-items:baseline;gap:12px;font-family:var(--fd);font-weight:800;font-size:17px;letter-spacing:.2em;white-space:nowrap}
.tc-event b{font-weight:800;background:var(--gold-grad);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.tc-event i{font-style:normal;color:var(--gold);opacity:.6}
.tc-event span{color:var(--ink)}
.tc-tools{grid-area:tools;display:flex;align-items:center;gap:10px}
.tc-days{display:flex;gap:6px}
.tc-day{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);font-family:var(--fd);font-weight:800;font-size:13px;color:var(--mute);background:rgba(255,255,255,.02)}
.tc-day.is-past{opacity:.38}
.tc-day.is-today{color:#1a1206;border-color:transparent;background:var(--gold-grad);background-size:200% 100%;box-shadow:0 0 0 3px rgba(242,193,78,.14),0 6px 18px rgba(242,193,78,.25)}
.tc-demo{padding:6px 11px 5px;border-radius:999px;border:1px solid rgba(242,193,78,.55);color:var(--gold);font-family:var(--fd);font-weight:800;font-size:11px;letter-spacing:.24em;background:rgba(242,193,78,.06)}
.tc-icon,.tc-histbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:999px;border:1px solid var(--line2);background:rgba(20,20,24,.88);color:var(--ink);font-weight:700;font-size:14px}
.tc-icon{width:44px}
.tc-icon svg,.tc-histbtn svg{width:19px;height:19px;color:var(--gold)}
.tc-histbtn{padding:0 16px}
.tc-histbtn.is-on{background:var(--gold);color:#1a1206;border-color:transparent}
.tc-histbtn.is-on svg{color:#1a1206}
.tc-histbtn:disabled,.tc-icon:disabled{opacity:.45}

/* ---------- sân khấu: tiêu đề + gợi ý ---------- */
.tc-stage{position:absolute;z-index:1;left:0;right:0;top:var(--headH);bottom:0}
.tc-titles{position:absolute;left:0;right:0;top:var(--titleTop,2vh);text-align:center;transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.tc-eyebrow{margin:0 0 8px;font-size:max(12px,calc(var(--titleSize,72px) * .17));font-weight:800;letter-spacing:.42em;color:var(--gold);opacity:.75;padding-left:.42em}
/* 17/11 hiệu năng: chữ vàng đứng yên (vẽ 1 lần, kể cả bóng mờ) + vệt sáng .tc-shine chạy bằng transform trên lớp riêng
   (khung có mặt nạ mép mềm trượt sang phải, chữ sáng bên trong trượt ngược lại nên luôn trùng chữ) — iPad không phải vẽ lại
   chữ + bóng mờ mỗi khung hình như kiểu chạy background-position cũ. */
.tc-title{position:relative;margin:0;display:inline-block;pointer-events:auto;font-family:var(--fd);font-weight:800;font-size:var(--titleSize,72px);line-height:1;letter-spacing:.015em;white-space:nowrap}
.tc-title-t{display:block;color:transparent;-webkit-background-clip:text;background-clip:text;background-size:220% 100%;background-position:13% 0;
  background-image:linear-gradient(100deg,#8a6420 0%,#c99634 10%,#f2c14e 22%,#fff4cf 30%,#e8b850 40%,#a97a28 52%,#f0c457 64%,#fff2c8 74%,#c99634 86%,#8a6420 100%);
  filter:drop-shadow(0 8px 30px rgba(242,193,78,.2))}
.tc-shine{position:absolute;top:0;bottom:0;left:0;width:34%;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 42%,#000 58%,transparent);mask-image:linear-gradient(90deg,transparent,#000 42%,#000 58%,transparent);
  transform:translate3d(-100%,0,0);animation:tcShineWin var(--shineT,6s) linear infinite}
.tc-shine>span{position:absolute;top:0;left:0;bottom:0;width:294.2%;display:block;white-space:nowrap;color:rgba(255,246,214,.62);
  transform:translate3d(34%,0,0);animation:tcShineTxt var(--shineT,6s) linear infinite}
@keyframes tcShineWin{0%{transform:translate3d(-100%,0,0)}62%,100%{transform:translate3d(294.2%,0,0)}}
@keyframes tcShineTxt{0%{transform:translate3d(34%,0,0)}62%,100%{transform:translate3d(-100%,0,0)}}
#tc.is-play .tc-titles .tc-shine,#tc.is-play .tc-titles .tc-shine>span{animation-play-state:paused}
.tc-sub{margin:9px 0 0;font-size:max(14px,calc(var(--titleSize,72px) * .225));color:var(--mute);letter-spacing:.04em}
.tc-cta{position:absolute;left:50%;bottom:var(--ctaBottom,28px);transform:translateX(-50%);margin:0;display:flex;align-items:center;gap:12px;padding:12px 22px 12px 14px;border-radius:999px;
  border:1px solid rgba(242,193,78,.4);background:rgba(16,15,13,.86);font-weight:700;font-size:16px;letter-spacing:.03em;white-space:nowrap;
  box-shadow:0 0 0 0 rgba(242,193,78,.35);animation:tcCta 2.2s ease-out infinite;transition:opacity .35s}
@keyframes tcCta{0%{box-shadow:0 0 0 0 rgba(242,193,78,.35)}70%,100%{box-shadow:0 0 0 16px rgba(242,193,78,0)}}
.tc-finger{position:relative;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,#fff2c8 0 22%,rgba(242,193,78,.55) 23% 46%,transparent 48%)}
.tc-finger::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--gold);animation:tcTap 1.6s ease-out infinite}
@keyframes tcTap{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.5);opacity:0}}
.tc-hint{position:absolute;left:50%;transform:translateX(-50%);top:var(--hintTop,auto);margin:0;font-size:16px;color:var(--mute);letter-spacing:.03em;white-space:nowrap;animation:tcFadeUp .5s ease both}
.tc-hint b{color:var(--gold-l)}
@keyframes tcFadeUp{from{opacity:0;transform:translate(-50%,8px)}}
.tc-alert{position:absolute;z-index:7;left:50%;top:calc(var(--headH) + 2px);transform:translateX(-50%);max-width:80vw;margin:0;padding:8px 14px;border-radius:12px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:rgba(255,45,85,.12);border:1px solid rgba(255,45,85,.5);color:#ffd3dc}

/* ---------- chuyển pha ---------- */
#tc.is-play .tc-titles{opacity:0;transform:translateY(-24px) scale(.96)}
#tc.is-play .tc-cta{opacity:0;pointer-events:none}

@media (orientation:portrait){
  .tc-mark{font-size:22vw;bottom:2vh}
}
@media (max-width:900px){.tc-day{width:32px;height:32px;font-size:12px}.tc-histbtn{padding:0 13px}.tc-event{font-size:15px;letter-spacing:.16em;gap:8px}.tc-tools{gap:7px}.tc-days{gap:4px}}
/* lite (iPad): nền gộp 1 ảnh vẽ sẵn (app.js liteScene), không vệt sáng chạy lặp trên chữ */
#tc.is-lite .tc-bg{background:var(--bgArt,#07070a) center/100% 100% no-repeat}
#tc.is-lite .tc-glow,#tc.is-lite .tc-spot,#tc.is-lite .tc-vignette,#tc.is-lite .tc-shine{display:none}
#tc.is-lite .tc-mark{visibility:hidden}
@media (prefers-reduced-motion:reduce){.tc-glow,.tc-motes i,.tc-title,.tc-cta,.tc-finger::after,.tc-shine,.tc-shine>span{animation:none}.tc-shine{display:none}}
/* 17/11 lỗi font: chữ vàng dùng background-clip:text chỉ tô trong khung chữ (line-height 1), nên dấu hỏi / huyền
   trên chữ hoa (THẺ, CÀO, ĐẶC) bị cắt mất phần trên. Nới khung lên trên rồi bù lại bằng margin âm để bố cục giữ nguyên. */
.tc-title{margin:-.26em 0 -.12em}
.tc-title-t,.tc-shine>span{padding:.26em .04em .12em}
.tc-event b{padding:.3em 0 .12em}

/* Thẻ kim loại đen: mặt sau (bộ bài), mặt trước (ô cào), lật 3D, tia sáng khi mở quà. Đơn vị cqw = % bề rộng thẻ. */

/* ---------- mặt thẻ dùng chung ---------- */
.tc-face{position:absolute;inset:0;border-radius:4.4cqw;overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden;
  background:radial-gradient(120% 90% at 18% 0%,rgba(255,255,255,.07),transparent 46%),radial-gradient(90% 80% at 100% 100%,rgba(242,193,78,.07),transparent 60%),var(--brushed,#0c0c0f) center/cover,#0c0c0f;
  box-shadow:inset 0 0 0 1px rgba(242,193,78,.34),inset 0 1px 0 rgba(255,255,255,.1),0 3cqw 7cqw rgba(0,0,0,.6),0 1cqw 2cqw rgba(0,0,0,.5)}
.tc-face::after{content:"";position:absolute;inset:-20%;pointer-events:none;z-index:4;background:linear-gradient(112deg,transparent 38%,rgba(255,248,225,.0) 42%,rgba(255,248,225,.16) 48%,rgba(255,248,225,.03) 53%,transparent 58%);transform:translateX(-70%)}
.tc-ros{position:absolute;aspect-ratio:1/1;background:var(--rosette) center/contain no-repeat;pointer-events:none}
.tc-waves{position:absolute;left:0;right:0;height:15cqw;background:var(--waves) center/100% 100% no-repeat;pointer-events:none}
.tc-gold{background:var(--gold-grad);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.tc-face .tc-logo{filter:none}

/* mặt sau */
.tc-back .tc-ros{left:50%;top:50%;width:76cqw;transform:translate(-50%,-50%);opacity:.5}
.tc-back .tc-waves{top:0;opacity:.28}
.tc-back .tc-waves.is-b{top:auto;bottom:0;transform:scaleY(-1)}
.tc-frame{position:absolute;inset:3.2cqw;border-radius:2.4cqw;border:1px solid rgba(242,193,78,.42);pointer-events:none}
.tc-frame::after{content:"";position:absolute;inset:.9cqw;border-radius:1.8cqw;border:1px solid rgba(242,193,78,.16)}
.tc-emb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1.6cqw;padding:3cqw 5cqw;border-radius:50%;
  background:radial-gradient(closest-side,rgba(7,7,10,.92) 55%,rgba(7,7,10,0))}
.tc-emb .tc-logo{width:6.4cqw;height:9.8cqw}
.tc-emb b{font-family:var(--fd);font-weight:800;font-size:3.4cqw;letter-spacing:.62em;padding-left:.62em;line-height:1}
.tc-emb small{font-size:1.55cqw;font-weight:800;letter-spacing:.52em;padding-left:.52em;color:rgba(242,193,78,.75)}
.tc-corner{position:absolute;font-size:1.45cqw;font-weight:800;letter-spacing:.42em;color:rgba(242,193,78,.62);line-height:1}
.tc-corner.is-tl{left:6.2cqw;top:6.2cqw}
.tc-corner.is-br{right:6.2cqw;bottom:6.2cqw}

/* mặt trước */
.tc-front .tc-ros{left:-24cqw;top:50%;width:70cqw;transform:translateY(-50%);opacity:.17}
.tc-front .tc-waves{bottom:0;opacity:.3}
.tc-fl{position:absolute;left:5.2cqw;top:5cqw;bottom:5cqw;width:32cqw;display:flex;flex-direction:column;align-items:flex-start}
.tc-fl-brand{display:flex;align-items:center;gap:1.5cqw}
.tc-fl-brand .tc-logo{width:3.2cqw;height:4.9cqw}
.tc-fl-brand b{font-family:var(--fd);font-weight:800;font-size:2.1cqw;letter-spacing:.5em;line-height:1}
.tc-fl-bf{margin:4.4cqw 0 0;font-family:var(--fd);font-weight:800;font-size:5.9cqw;line-height:.98;letter-spacing:.01em}
.tc-fl-date{margin:1.4cqw 0 0;font-size:1.6cqw;font-weight:800;letter-spacing:.36em;color:rgba(246,242,234,.72)}
.tc-fl-foot{margin-top:auto;display:flex;flex-direction:column;gap:.7cqw}
.tc-fl-foot b{font-size:1.75cqw;font-weight:800;letter-spacing:.34em;color:var(--gold)}
.tc-fl-foot span{font-size:1.5cqw;font-weight:700;letter-spacing:.24em;color:rgba(246,242,234,.5)}

/* ô cào */
.tc-win{position:absolute;top:4.4cqw;right:4.4cqw;bottom:4.4cqw;left:40.5cqw;border-radius:2.8cqw;overflow:hidden;background:#0b0a08;
  box-shadow:0 0 0 1px rgba(242,193,78,.6),0 0 0 .55cqw rgba(0,0,0,.45),0 0 0 .7cqw rgba(242,193,78,.18),inset 0 .3cqw 1.4cqw rgba(0,0,0,.7)}
.tc-prize{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2cqw;padding:3cqw;text-align:center;
  background:radial-gradient(64% 52% at 50% 42%,#5a4d33 0%,#2d261b 42%,#120f0b 78%,#0a0907 100%)}
.tc-prize::before{content:"";position:absolute;left:50%;top:44%;width:40cqw;height:40cqw;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,231,163,.28),transparent 70%)}
.tc-prize::after{content:"";position:absolute;inset:1.6cqw;border-radius:1.8cqw;border:1px solid rgba(242,193,78,.22);pointer-events:none}
.tc-ptier{position:relative;font-size:1.55cqw;font-weight:800;letter-spacing:.34em;padding-left:.34em;color:var(--gold)}
/* .tc-pbox ôm ảnh quà và nhận chuyển động; bóng đổ nằm trên ảnh (không chuyển động) nên chỉ vẽ 1 lần, không thành bóng
   CALayer tính lại mỗi khung hình trên iPad. */
.tc-pbox{position:relative;display:block;width:100%}
.tc-pimg{position:relative;display:block;margin:0 auto;max-width:74%;max-height:26cqw;object-fit:contain;filter:drop-shadow(0 1.6cqw 1.8cqw rgba(0,0,0,.65))}
.tc-pname{position:relative;font-family:var(--fd);font-weight:800;font-size:2.9cqw;line-height:1.12;color:#fff;letter-spacing:.01em}
.tc-pvar{position:relative;font-size:1.6cqw;color:var(--mute);margin-top:-.3cqw}
.tc-ticket{position:relative;display:flex;flex-direction:column;align-items:center;gap:.6cqw;padding:2.2cqw 5cqw;border-radius:2cqw;border:1px dashed rgba(242,193,78,.6);background:rgba(242,193,78,.06)}
.tc-ticket b{font-family:var(--fd);font-weight:800;font-size:10cqw;line-height:1}
.tc-ticket small{font-size:1.6cqw;font-weight:800;letter-spacing:.4em;color:var(--gold-l);padding-left:.4em}
.tc-foil{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;z-index:2}
.tc-foil.is-clearing{animation:tcClear .8s ease-in forwards;pointer-events:none}
/* 17/11 vòng 2: chỉ opacity + transform (filter sáng lên bắt iPad vẽ lại canvas mỗi khung); vệt sáng .tc-win::after lo phần lóe sáng */
@keyframes tcClear{0%{opacity:1;transform:none}30%{opacity:.94}100%{opacity:0;transform:scale(1.06)}}
.tc-win::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(105deg,transparent 30%,rgba(255,246,214,.55) 47%,rgba(255,255,255,.85) 50%,rgba(255,246,214,.4) 53%,transparent 70%);transform:translateX(-120%)}
.tc-win.is-revealed::after{animation:tcSweep 1s .1s ease-out}
.tc-win.is-revealed .tc-pbox,.tc-win.is-revealed .tc-ticket{animation:tcPop .8s cubic-bezier(.2,1.5,.4,1) both,tcFloat 3.4s ease-in-out .8s infinite}
.tc-win.is-revealed .tc-pname,.tc-win.is-revealed .tc-ptier{animation:tcRise .6s .15s ease both}
@keyframes tcSweep{to{transform:translateX(120%)}}
@keyframes tcPop{0%{transform:scale(.6);opacity:.2}100%{transform:none;opacity:1}}
@keyframes tcFloat{50%{transform:translateY(-.8cqw)}}
@keyframes tcRise{from{transform:translateY(1.4cqw);opacity:0}}
/* gợi ý cào: chấm sáng lướt zic-zac trên lớp vàng tới khi khách chạm */
.tc-guide{position:absolute;z-index:3;left:0;top:0;width:7cqw;height:7cqw;margin:-3.5cqw 0 0 -3.5cqw;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.95) 0 18%,rgba(255,246,214,.5) 30%,transparent 66%);animation:tcGuide 2.6s ease-in-out infinite}
@keyframes tcGuide{0%{transform:translate(9cqw,14cqw);opacity:0}12%{opacity:1}30%{transform:translate(43cqw,20cqw)}50%{transform:translate(12cqw,30cqw)}72%{transform:translate(44cqw,38cqw);opacity:1}90%,100%{transform:translate(20cqw,44cqw);opacity:0}}

/* ---------- bộ bài ---------- */
.tc-deck{position:absolute;inset:0;pointer-events:none}
.tc-dcard{position:absolute;container-type:inline-size;pointer-events:auto;width:var(--dw);height:calc(var(--dw) / 1.586);left:var(--x);top:var(--y);margin:0;padding:0;border:0;background:none;
  transform:translate(0,0) rotate(var(--rot));transition:transform .35s cubic-bezier(.2,.9,.3,1.2),opacity .4s,filter .3s;outline:none}
.tc-dcard .tc-face{animation:tcBob 4.6s ease-in-out infinite;animation-delay:calc(var(--i) * -.55s)}
.tc-dcard .tc-face::after{animation:tcGloss 6.5s ease-in-out infinite;animation-delay:calc(var(--i) * .14s)}
@keyframes tcBob{50%{transform:translateX(1.6cqw)}}
@keyframes tcGloss{0%,62%{transform:translateX(-70%)}84%,100%{transform:translateX(70%)}}
.tc-dcard.is-press{transform:translate(calc(var(--lx) * 1px),calc(var(--ly) * 1px)) rotate(var(--rot))}
/* chỉ khi có chuột thật: trên iPad cảm ứng :hover bị "dính" sau cú chạm và làm 6 thẻ còn lại chạy filter khi thẻ bay */
@media (hover:hover) and (pointer:fine){#tc.is-deck .tc-deck:hover .tc-dcard:not(:hover){filter:brightness(.82)}}
#tc.is-deal .tc-dcard{animation:tcDeal .7s cubic-bezier(.2,.9,.25,1.1) both;animation-delay:calc(var(--i) * 70ms)}
@keyframes tcDeal{from{transform:translate(0,60vh) rotate(var(--rot));opacity:0}}
#tc.is-play .tc-dcard{transform:translate(0,75vh) rotate(var(--rot));opacity:0;transition:transform .8s cubic-bezier(.5,0,.75,0),opacity .6s .2s;transition-delay:calc(var(--o) * 40ms)}
/* bộ bài đã rời màn hình: dừng nhịp lắc + vệt bóng của 7 thẻ cho tới lượt sau */
#tc.is-play .tc-dcard .tc-face,#tc.is-play .tc-dcard .tc-face::after{animation-play-state:paused}
.tc-dcard.is-picked{visibility:hidden}

/* ---------- thẻ đang chơi (bay ra giữa + lật) ---------- */
.tc-flyer{position:absolute;z-index:3;left:var(--fx);top:var(--fy);width:var(--cw);height:var(--ch);container-type:inline-size;perspective:2000px}
.tc-card3d{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.tc-card3d .tc-back{transform:rotateY(180deg)}
.tc-card3d.is-front .tc-back,.tc-card3d.is-back .tc-front{visibility:hidden}
.tc-flyer.is-sweep .tc-face::after{animation:tcSweepCard 1.1s ease-out}
@keyframes tcSweepCard{from{transform:translateX(-70%)}to{transform:translateX(70%)}}
.tc-flyer.is-won .tc-front{box-shadow:inset 0 0 0 1px rgba(242,193,78,.7),0 0 0 1px rgba(242,193,78,.5),0 0 7cqw rgba(242,193,78,.42),0 3cqw 7cqw rgba(0,0,0,.6)}
/* hub: quầng sáng nhấp nháy = lớp ::after chỉ đổi opacity (không vẽ lại cả mặt thẻ mỗi khung hình) */
.tc-flyer.is-won.is-hub::after{content:"";position:absolute;inset:0;border-radius:4.4cqw;pointer-events:none;opacity:0;
  box-shadow:inset 0 0 0 1px rgba(255,242,200,.9),0 0 0 2px rgba(242,193,78,.8),0 0 12cqw rgba(242,193,78,.4);animation:tcHubGlow 1.1s ease-in-out infinite alternate}
@keyframes tcHubGlow{to{opacity:1}}
/* thẻ ảnh vẽ sẵn chỉ dùng lúc bay + lật (card.js ghostOf) */
.tc-ghost{position:absolute;inset:0;pointer-events:none}
.tc-gface{position:absolute;inset:0;display:block;width:100%;height:100%;border-radius:4.4cqw;overflow:hidden;box-shadow:0 3cqw 7cqw rgba(0,0,0,.6),0 1cqw 2cqw rgba(0,0,0,.5)}
.tc-gface.is-back{transform:rotateY(180deg);opacity:0;background:var(--backArt) center/100% 100% no-repeat,#0c0c0f}
/* bộ bài: mặt sau = 1 ảnh vẽ sẵn dùng chung (scene.back) thay cho hoa văn + chữ + logo của từng thẻ */
#tc.has-art .tc-dcard .tc-back>*{display:none}
#tc.has-art .tc-dcard .tc-back{background:var(--backArt) center/100% 100% no-repeat,#0c0c0f;box-shadow:0 3cqw 7cqw rgba(0,0,0,.6),0 1cqw 2cqw rgba(0,0,0,.5)}
/* lite (iPad): tia sáng = 1 ảnh xoay, không mặt nạ; bộ bài không chạy vệt bóng từng thẻ */
#tc.is-lite .tc-rays{background:var(--raysArt) center/100% 100% no-repeat;-webkit-mask-image:none;mask-image:none}
#tc.is-lite .tc-dcard .tc-face::after{display:none}
/* lite: 7 thẻ không lắc riêng (mỗi thẻ thành 1 lớp GPU lớn kèm bóng đổ ~ 30 MB); cả bộ bài nhịp nhẹ chung 1 lớp */
#tc.is-lite .tc-dcard .tc-face{animation:none}
#tc.is-lite.is-deck .tc-deck{animation:tcDeckBob 4.6s ease-in-out infinite}
@keyframes tcDeckBob{50%{transform:translateY(-.7vh)}}
@media (prefers-reduced-motion:reduce){#tc.is-lite.is-deck .tc-deck{animation:none}}
.tc-flyer.is-leaving{transition:transform .55s cubic-bezier(.5,0,.75,0),opacity .45s .1s;transform:translateY(-30vh) scale(.6) rotate(-6deg);opacity:0}

/* tia sáng + chữ giải đặc biệt */
/* 17/11 hiệu năng: mặt nạ cũ tắt hẳn ở bán kính 46.67vmax trên khối 220vmax — thu khối còn 96vmax, cùng điểm dừng tính
   bằng vmax nên hình y hệt, ít điểm ảnh hơn ~5 lần; chỉ quay khi đang hiện. */
.tc-rays{position:absolute;z-index:1;left:var(--rx,50%);top:var(--ry,50%);width:96vmax;height:96vmax;margin:-48vmax 0 0 -48vmax;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .8s,visibility 0s .8s;
  background:repeating-conic-gradient(from 0deg,rgba(242,193,78,.55) 0deg 3deg,transparent 3deg 12deg);
  -webkit-mask-image:radial-gradient(circle 48vmax at 50% 50%,#000 0,rgba(0,0,0,.4) 21.78vmax,transparent 46.67vmax);mask-image:radial-gradient(circle 48vmax at 50% 50%,#000 0,rgba(0,0,0,.4) 21.78vmax,transparent 46.67vmax);
  animation:tcSpin 60s linear infinite;animation-play-state:paused}
.tc-rays.is-on{opacity:.42;visibility:visible;transition:opacity .8s;animation-play-state:running}
.tc-rays.is-hub{opacity:.75;animation-duration:28s}
@keyframes tcSpin{to{transform:rotate(360deg)}}
/* chữ GIẢI ĐẶC BIỆT: vàng + bóng mờ đứng yên (vẽ 1 lần), vệt sáng .tc-shine chạy bằng transform; vào cảnh bằng
   scale + opacity (bỏ co letter-spacing: mỗi khung phải dàn chữ + vẽ lại bóng mờ đúng lúc pháo giấy bắn). */
.tc-banner{position:absolute;z-index:4;left:0;right:0;top:var(--by,8%);margin:0;text-align:center;pointer-events:none;font-family:var(--fd);font-weight:800;font-size:var(--bs,54px);line-height:1;letter-spacing:.04em;
  animation:tcBanner .9s cubic-bezier(.2,1.4,.4,1) both;--shineT:3.2s}
.tc-banner-t{display:block;color:transparent;-webkit-background-clip:text;background-clip:text;background-size:200% 100%;background-position:25% 0;
  background-image:linear-gradient(100deg,#b8862b,#f2c14e 25%,#fff4cf 45%,#f2c14e 60%,#b8862b);filter:drop-shadow(0 0 22px rgba(242,193,78,.55))}
.tc-banner .tc-shine{width:30%}
.tc-banner .tc-shine>span{width:333.3%;text-align:center;transform:translate3d(30%,0,0);animation-name:tcShineTxtB}
.tc-banner .tc-shine small{visibility:hidden}
@keyframes tcShineTxtB{0%{transform:translate3d(30%,0,0)}62%,100%{transform:translate3d(-100%,0,0)}}
.tc-banner .tc-shine{animation-name:tcShineWinB}
@keyframes tcShineWinB{0%{transform:translate3d(-100%,0,0)}62%,100%{transform:translate3d(333.3%,0,0)}}
.tc-banner small{display:block;margin-top:10px;font-family:var(--ft);font-size:15px;letter-spacing:.5em;color:var(--hot);-webkit-text-fill-color:var(--hot);filter:none}
@keyframes tcBanner{0%{transform:scale(1.8);opacity:0}100%{transform:none;opacity:1}}

.tc-fx{position:absolute;inset:0;width:100%;height:100%;z-index:9;pointer-events:none}

/* thẻ quà nhân viên đang mở: đứng yên mọi chuyển động lặp phía sau lớp phủ (lớp phủ không còn làm mờ nền) */
#tc.is-result .tc-rays,#tc.is-result .tc-shine,#tc.is-result .tc-shine>span,#tc.is-result .tc-flyer::after,
#tc.is-result .tc-win.is-revealed .tc-pbox,#tc.is-result .tc-win.is-revealed .tc-ticket{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.tc-dcard .tc-face,.tc-dcard .tc-face::after,.tc-rays,.tc-guide,.tc-win.is-revealed .tc-pbox,.tc-flyer.is-won.is-hub::after{animation:none}}
/* 17/11 lỗi font: nới vùng tô chữ vàng cho dấu trên chữ hoa (xem base.css). */
.tc-gold{padding-top:.28em}
.tc-fl-bf.tc-gold{padding-top:.28em;margin-top:calc(4.4cqw - .28em)}
.tc-banner{margin-top:-.3em}
.tc-banner-t,.tc-banner .tc-shine>span{padding:.3em 0 .12em}

/* Thẻ quà cho nhân viên, lịch sử, quản lý (PIN). */
.tc-layer{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;touch-action:pan-y}
/* 17/11 hiệu năng: bỏ backdrop-filter blur (iPad phải làm mờ lại cả màn hình mỗi khung khi pháo giấy / tia sáng chạy
   phía dưới); nền đậm hơn chút để bù độ mờ. */
.tc-result{background:radial-gradient(70% 70% at 50% 50%,rgba(20,17,10,.74),rgba(4,4,6,.92));animation:tcFade .35s ease both}
@keyframes tcFade{from{opacity:0}}
.tc-rcard{position:relative;width:min(820px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);align-items:stretch;border-radius:30px;
  background:linear-gradient(160deg,#1b1a17,#0e0e10 60%);box-shadow:0 0 0 1px rgba(242,193,78,.45),0 40px 100px rgba(0,0,0,.7),0 0 80px rgba(242,193,78,.12);animation:tcRIn .55s cubic-bezier(.2,1.3,.4,1) both}
@keyframes tcRIn{from{transform:translateY(30px) scale(.94);opacity:0}}
.tc-rcard.is-hub{box-shadow:0 0 0 1.5px rgba(242,193,78,.9),0 40px 100px rgba(0,0,0,.7),0 0 120px rgba(242,193,78,.3)}
.tc-rphoto{position:relative;display:flex;align-items:center;justify-content:center;min-height:300px;padding:28px;border-radius:30px 0 0 30px;overflow:hidden;
  background:radial-gradient(70% 60% at 50% 45%,#5a4d33 0%,#2a2419 45%,#0f0d0a 85%)}
.tc-rphoto::before{content:"";position:absolute;inset:0;background:var(--rosette) center/115% no-repeat;opacity:.1}
.tc-rphoto .tc-pbox{animation:tcPop .7s cubic-bezier(.2,1.5,.4,1) both}
.tc-rphoto img{position:relative;display:block;margin:0 auto;max-width:86%;max-height:270px;object-fit:contain;filter:drop-shadow(0 22px 26px rgba(0,0,0,.6))}
.tc-rphoto .tc-ticket{font-size:16px;container-type:inline-size;width:80%}
.tc-rphoto .tc-ticket b{font-size:24cqw}
.tc-rphoto .tc-ticket small{font-size:4cqw}
.tc-rinfo{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:30px 32px 28px}
.tc-rtier{display:inline-block;padding:7px 14px 6px;border-radius:999px;border:1px solid rgba(242,193,78,.6);color:var(--gold);font-size:12.5px;font-weight:800;letter-spacing:.24em}
.tc-rcard.is-hub .tc-rtier{border-color:transparent;background:var(--gold-grad);background-size:200% 100%;color:#1a1206}
.tc-rname{margin:0;font-family:var(--fd);font-weight:800;font-size:clamp(24px,2.6vw,32px);line-height:1.12;color:#fff}
.tc-rnote{margin:0;font-size:15.5px;color:var(--mute);line-height:1.45}
.tc-rnote b{color:var(--ink)}
.tc-rtag{display:inline-block;padding:4px 10px;border-radius:999px;background:rgba(242,193,78,.1);color:var(--gold-l);font-size:12px;font-weight:800;letter-spacing:.14em}
.tc-pick{width:100%;flex:0 0 auto}
.tc-pick p{margin:4px 0 8px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tc-chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;align-content:flex-start}
.tc-chip{display:inline-flex;align-items:center;gap:8px;height:42px;padding:5px 14px 5px 5px!important;border-radius:999px;border:1px solid var(--line2)!important;background:rgba(255,255,255,.05)!important;font-size:14px;font-weight:700;transition:transform .12s,background .2s}
.tc-chip:active{transform:scale(.96)}
.tc-chip img{width:30px;height:30px;object-fit:contain}
.tc-chip i{width:22px;height:22px;margin:4px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.tc-chip em{font-style:normal;font-weight:400;opacity:.65}
.tc-chip.is-on{background:var(--gold)!important;border-color:transparent!important;color:#1a1206}
.tc-chip:disabled{opacity:.28}
.tc-done{margin-top:auto;align-self:stretch;padding:18px 24px!important;border-radius:16px;background:var(--gold-grad)!important;background-size:200% 100%!important;color:#1a1206;font-family:var(--fd);font-weight:800;font-size:16px;letter-spacing:.06em;
  box-shadow:0 5px 0 #7a5a1c,0 14px 30px rgba(242,193,78,.22);transition:transform .1s,box-shadow .1s}
.tc-done:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a1c,0 8px 20px rgba(242,193,78,.2)}
.tc-done:disabled{background:rgba(255,255,255,.08)!important;color:rgba(255,255,255,.4);box-shadow:none}

/* ---------- lịch sử ---------- */
.tc-hist{position:absolute;z-index:8;top:calc(var(--headH) - 4px);right:max(20px,env(safe-area-inset-right));width:min(440px,calc(100vw - 32px));max-height:min(68vh,620px);display:flex;flex-direction:column;
  padding:14px 18px 0;border-radius:22px;background:linear-gradient(180deg,#19181b,#0f0f12);border:1px solid var(--line);box-shadow:0 30px 70px rgba(0,0,0,.7);animation:tcDrop .22s cubic-bezier(.2,1.2,.4,1);touch-action:pan-y}
@keyframes tcDrop{from{opacity:0;transform:translateY(-8px) scale(.97)}}
.tc-hist-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 6px}
.tc-hist-h b{font-family:var(--fd);font-size:17px;letter-spacing:.14em;color:var(--gold)}
.tc-hist-h span{font-size:12.5px;color:var(--mute)}
.tc-hist-list{list-style:none;margin:0;padding:0;flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.tc-hist-list li{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;align-items:center;gap:11px;padding:8px 0;border-top:1px solid var(--line2)}
.tc-hist-list li:first-child{border-top:0}
.tc-hist-list li.is-new{animation:tcNew 1.6s ease-out}
@keyframes tcNew{from{background:rgba(242,193,78,.25)}}
.tc-th{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle,#4a3f2c,#17140f)}
.tc-th img{max-width:84%;max-height:84%;object-fit:contain}
.tc-th b{font-family:var(--fd);font-size:10px;color:var(--gold)}
.tc-hn{min-width:0;display:flex;flex-direction:column}
.tc-hn span{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-hn small{font-size:11.5px;color:var(--mute)}
.tc-ht{padding:3px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;border:1px solid rgba(255,45,85,.6);color:#ffb3c2}
.tc-ht.is-void{border-color:rgba(255,255,255,.25);color:var(--mute)}
.tc-hist-list li.is-void .tc-hn span{text-decoration:line-through;opacity:.6}
.tc-hist-list time{font-size:13px;font-weight:700;color:var(--mute)}
.tc-empty{display:flex!important;flex-direction:column;align-items:center;gap:4px;padding:26px 0!important;text-align:center;font-weight:700}
.tc-empty small{font-weight:400;color:var(--mute)}
.tc-modebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px -18px 0;padding:10px 18px 12px;border-top:1px solid var(--line2);font-size:13px;color:var(--mute)}
.tc-modebar b{color:var(--ink)}
.tc-modeswap{padding:8px 14px!important;border-radius:999px;border:1px solid var(--line2)!important;font-size:13px;font-weight:800}

/* ---------- quản lý ---------- */
.tc-adminlayer{background:rgba(4,4,6,.92)}
.tc-admin{width:min(1000px,100%);max-height:calc(100vh - 48px);overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;border-radius:24px;padding:22px 24px;
  background:linear-gradient(180deg,#17171b,#101013);border:1px solid var(--line);box-shadow:0 40px 100px rgba(0,0,0,.7);color:var(--ink);-webkit-user-select:text;user-select:text}
.tc-admin h2{margin:0 0 2px;font-family:var(--fd);font-size:20px;letter-spacing:.04em;color:var(--gold)}
.tc-admin h3{margin:18px 0 6px;font-size:15px;font-weight:800;color:var(--ink)}
.tc-admin p{margin:0 0 10px;color:var(--mute);font-size:14px}
.tc-admin p b{color:var(--ink)}
.tc-tabs{display:flex;gap:4px;margin:12px 0 8px;padding:4px;border-radius:14px;background:rgba(255,255,255,.05);width:max-content;max-width:100%;overflow:auto}
.tc-tab{padding:9px 14px!important;border-radius:10px;font-weight:700;font-size:14px;color:var(--mute)}
.tc-tab.is-on{background:var(--gold)!important;color:#1a1206}
.tc-admin table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 14px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.03)}
.tc-admin th,.tc-admin td{padding:9px 11px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
.tc-admin th{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);background:rgba(255,255,255,.03)}
.tc-admin .num{text-align:right}
.tc-plus{color:#7fd8a0;font-weight:800}
.tc-minus{color:#ff8fa4;font-weight:800}
.tc-tag{display:inline-block;white-space:nowrap;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,255,255,.08);color:var(--mute)}
.tc-tag.is-void{background:rgba(255,45,85,.15);color:#ffb3c2}
.tc-tag.is-test{background:rgba(242,193,78,.14);color:var(--gold-l)}
.tc-swatch{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:7px;vertical-align:-1px;box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.tc-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 12px}
.tc-btn{padding:10px 14px!important;border-radius:12px;background:var(--gold)!important;color:#1a1206;font-weight:800;font-size:14px}
.tc-btn.is-soft{background:rgba(255,255,255,.08)!important;color:var(--ink)}
.tc-btn.is-red{background:rgba(255,45,85,.16)!important;color:#ffb3c2}
.tc-num,.tc-text{padding:8px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:#0b0b0d;color:var(--ink);font-size:15px}
.tc-num{width:84px;-moz-appearance:textfield}
.tc-num::-webkit-inner-spin-button,.tc-num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.tc-text{width:220px}
.tc-color{width:44px;height:36px;padding:0;border:0;background:none}
.tc-pin{display:flex;gap:10px;justify-content:center;margin:16px 0}
.tc-pin input{width:190px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0b0b0d;color:var(--ink);font-size:22px;text-align:center;letter-spacing:.3em}
.tc-err{color:#ff8fa4!important;text-align:center}
.tc-ok{color:#7fd8a0!important}

@media (orientation:portrait){
  .tc-rcard{grid-template-columns:minmax(0,1fr);width:min(620px,100%)}
  .tc-rphoto{border-radius:30px 30px 0 0;min-height:260px}
}
.tc-import{margin:0 0 14px;padding:12px 14px;border:1px solid var(--line2);border-radius:14px;background:rgba(242,193,78,.06)}
.tc-import p{margin:0 0 8px}

</style>
</head>
<body>
<div id="tc" class="is-deck">
  <div class="tc-bg" aria-hidden="true">
    <span class="tc-glow"></span><span class="tc-spot"></span><span class="tc-mark">BLACK FRIDAY</span>
    <span class="tc-motes" id="tcMotes"></span><span class="tc-vignette"></span>
  </div>

  <header class="tc-head">
    <button class="tc-brand" id="tcBrand" type="button" aria-label="Lucas"><span class="tc-logo"></span></button>
    <p class="tc-event"><b>BLACK FRIDAY</b><i aria-hidden="true">·</i><span>27–30.11</span></p>
    <div class="tc-tools">
      <div class="tc-days" id="tcDays" aria-label="Chương trình 27 đến 30 tháng 11"></div>
      <button class="tc-icon" id="tcMute" type="button" aria-label="Tắt / bật âm thanh"></button>
      <button class="tc-histbtn" id="tcHistBtn" type="button" aria-expanded="false" aria-controls="tcHist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>Lịch sử</button>
    </div>
  </header>

  <main class="tc-stage" id="tcStage">
    <div class="tc-titles" id="tcTitles">
      <p class="tc-eyebrow">LUCAS · BLACK FRIDAY 2026</p>
      <h1 class="tc-title" id="tcTitle"><span class="tc-title-t">BLACK CARD</span><span class="tc-shine" aria-hidden="true"><span>BLACK CARD</span></span></h1>
      <p class="tc-sub">Cào là trúng · nhận quà ngay tại quầy</p>
    </div>
    <div class="tc-deck" id="tcDeck" aria-label="Bộ thẻ đen"></div>
    <div class="tc-rays" id="tcRays" aria-hidden="true"></div>
    <p class="tc-banner" id="tcBanner" hidden></p>
    <div class="tc-flyer" id="tcFlyer" hidden></div>

    el.brand.addEventListener("pointerdown", function () {
      holdEnd();
      el.brand.classList.add("is-holding");
      hold = { fired: false, timer: window.setTimeout(function () {
        holdEnd(); hold = E.assign(hold, { fired: true }); taps = [];
        adminUi.openModePin(isContent() ? "event" : "content", "");
      }, CFG.holdMs) };
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (t) { el.brand.addEventListener(t, holdEnd); });
    el.brand.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });
    el.brand.addEventListener("click", function () { if (hold.fired) { hold = E.assign(hold, { fired: false }); return; } tapCount(); });
    el.title.addEventListener("click", tapCount);
    $("tcModeSwap").addEventListener("click", function () { setHist(false); adminUi.openModePin(isContent() ? "event" : "content", ""); });
  }
  function bindDeck() {
    var press = null;
    el.deck.addEventListener("pointerdown", function (ev) {
      var card = ev.target.closest ? ev.target.closest(".tc-dcard") : null;
      if (!card || ui.phase !== "deck") { return; }
      A.unlock();
      press = { card: card, x: ev.clientX, y: ev.clientY, id: ev.pointerId };
      var rot = (parseFloat(card.style.getPropertyValue("--rot")) + 90) * Math.PI / 180;
      card.style.setProperty("--lx", (Math.sin(rot) * 26).toFixed(1));
      card.style.setProperty("--ly", (-Math.cos(rot) * 26).toFixed(1));
      card.classList.add("is-press");
    });
    function release(ev, cancel) {
      if (!press || ev.pointerId !== press.id) { return; }
      var p = press;
      press = null;
      p.card.classList.remove("is-press");
      var moved = Math.hypot(ev.clientX - p.x, ev.clientY - p.y);
      if (!cancel && (moved < 40 || ev.clientY - p.y < -30)) { startDraw(p.card); }
    }
    el.deck.addEventListener("pointerup", function (ev) { release(ev, false); });
    el.deck.addEventListener("pointercancel", function (ev) { release(ev, true); });
    el.deck.addEventListener("keydown", function (ev) {
      var card = ev.target.closest ? ev.target.closest(".tc-dcard") : null;
      if (card && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); startDraw(card); }
    });
  }
  function bindUi() {
    el.rcard.addEventListener("click", function (ev) {
      var b = ev.target.closest ? ev.target.closest("[data-pick],[data-act]") : null;
      if (!b || b.disabled) { return; }
      if (b.hasAttribute("data-pick")) { choosePick(b.getAttribute("data-pick")); return; }
      if (b.getAttribute("data-act") === "done") { finish(); }
    });
    /* Chạm thẻ sau khi đã mở quà (chạm mới, không phải nét cào cuối) thì sang thẻ quà luôn. */
    el.flyer.addEventListener("pointerdown", function () {
      if (ui.phase === "reveal" && Date.now() - ui.revealedAt > 900) { clearTimers(); showResult(); }
    });
    el.mute.addEventListener("click", function () { persist(E.assign(state, { muted: !state.muted })); if (!state.muted) { A.unlock(); A.tap(); } render(); });
    el.histBtn.addEventListener("click", function () { if (ui.phase !== "drawing" && ui.phase !== "reveal") { setHist(el.hist.hidden); } });
    el.root.addEventListener("click", function (ev) {
      if (el.hist.hidden || el.hist.contains(ev.target) || el.histBtn.contains(ev.target)) { return; }
      setHist(false);
    }, true);
    document.addEventListener("pointerdown", function () { A.unlock(); lastTouch = Date.now(); }, { passive: true });
    /* Quên tắt Content sau khi quay: không ai chạm máy CFG.contentIdleMin phút thì tự về Sự kiện (khách thật luôn trừ kho). */
    window.setInterval(function () {
      if (isContent() && ui.phase === "deck" && Date.now() - lastTouch > E.CFG.contentIdleMin * 60000) {
        persist(E.assign(state, { mode: "event" }));
        render();
      }
    }, 60000);
    /* Không cuộn / phóng to trang khi cào (iPad); bảng quản lý / lịch sử / thẻ quà vẫn cuộn được. */
    document.addEventListener("touchmove", function (ev) {
      var t = ev.target;
      if (!(t.closest && t.closest(".tc-admin,.tc-hist-list,.tc-rcard"))) { ev.preventDefault(); }
    }, { passive: false });
    ["gesturestart", "gesturechange", "dblclick"].forEach(function (t) { document.addEventListener(t, function (ev) { ev.preventDefault(); }, { passive: false }); });
    document.addEventListener("keydown", function (ev) {
      var typing = ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName || "");
      if (!typing && !ev.repeat && !ev.metaKey && !ev.ctrlKey && (ev.key || "").toLowerCase() === "m") { adminUi.openModePin(isContent() ? "event" : "content", ""); }
    });
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") { wakeLock = null; render(); } else { A.scratchStop(); } });
    window.addEventListener("resize", function () { if (ui.phase === "deck" || ui.phase === "result") { layout(); } });
    /* Thẻ quạt / thẻ bay có thể làm khung app bị cuộn khi nút nhận focus: luôn kéo về 0. */
    [el.root, el.stage].forEach(function (box) {
      box.addEventListener("scroll", function () { if (box.scrollTop || box.scrollLeft) { box.scrollTop = 0; box.scrollLeft = 0; } });
    });
  }

  /* ---------- khởi động ---------- */
  function decorate() {
    var t = TC.art.textures();
    el.root.style.setProperty("--brushed", t.brushed);
    el.root.style.setProperty("--rosette", t.rosette);
    el.root.style.setProperty("--waves", t.waves);
    /* Logo vàng = ảnh logo làm mặt nạ cho dải vàng; gắn bằng thẻ style để đường dẫn tính theo trang (không theo css/). */
    var logo = document.createElement("style");
    logo.textContent = ".tc-logo{-webkit-mask-image:url(\"" + E.IMG.logo + "\");mask-image:url(\"" + E.IMG.logo + "\")}";
    document.head.appendChild(logo);
    motes();
  }
  /* 17/11: 26 → 18 đốm; lite (iPad) chỉ 7 đốm, bớt lớp chuyển động nền. */
  function motes() {
    $("tcMotes").innerHTML = Array.from({ length: TC.perf.isLite() ? 7 : 18 }, function (_, i) {
      return "<i style=\"left:" + ((i * 37 + 11) % 100) + "%;--s:" + (2 + (i * 7) % 4) + "px;--o:" + (0.25 + ((i * 13) % 6) / 10).toFixed(2) +
        ";--t:" + (16 + (i * 7) % 14) + "s;--d:" + (-(i * 1.7)).toFixed(1) + "s;--x:" + (((i % 5) - 2) * 3) + "vw\"></i>";
    }).join("");
  }
  /* ---------- ảnh vẽ sẵn (vòng 2 hiệu năng) ---------- */
  var artReady = false;
  function frontArt(foil) { return TC.scene.front(el.root, parseFloat(geo.cw.toFixed(1)), TC.perf.dpr("art"), foil); }
  /* Mặt sau thẻ vẽ 1 lần → 7 thẻ bộ bài + thẻ bay dùng chung 1 ảnh (không còn 7 lớp hoa văn + chữ riêng). */
  function prepareArt() {
    TC.scene.loadLogo().then(function () {
      var back = TC.scene.back(el.root, parseFloat(geo.cw.toFixed(1)), TC.perf.dpr("art"));
      el.root.style.setProperty("--backArt", TC.art.cssUrl(back.toDataURL("image/jpeg", 0.92)));
      el.root.classList.add("has-art");
      artReady = true;
      prepareFoil();
    }).catch(function () { artReady = false; });
  }
  /* Lite: nền trang (nền, quầng sáng, đốm sáng dưới, chữ BLACK FRIDAY mờ, viền tối) gộp 1 ảnh; tia sáng = 1 ảnh xoay. */
  var raysDone = false;
  function liteScene() {
    if (!TC.perf.isLite()) { return; }
    var bg = TC.scene.background(window.innerWidth, window.innerHeight, TC.perf.dpr("bg"), document.querySelector(".tc-mark"));
    el.root.style.setProperty("--bgArt", TC.art.cssUrl(bg.toDataURL("image/jpeg", 0.9)));
    if (!raysDone) { raysDone = true; el.root.style.setProperty("--raysArt", TC.art.cssUrl(TC.scene.rays(1024).toDataURL("image/png"))); }
  }
  function applyLite(on) {
    el.root.classList.toggle("is-lite", on);
    motes();
    TC.fx.resize();
    if (on) { liteScene(); }
  }
  /* Cỡ ô cào = cỡ thẻ giữa màn hình trừ lề (card.css .tc-win: trái 40.5cqw, phải / trên / dưới 4.4cqw). */
  function prepareFoil() {
    if (ui.phase !== "deck") { return; }
    TC.foil.prepare(Math.round(geo.cw * (1 - 0.405 - 0.044)), Math.round(geo.ch - geo.cw * 0.088), TC.perf.dpr("foil"), artReady ? frontArt : null);
  }
  function restorePending() {
    var pending = state.spins.filter(function (x) { return !x.void && !x.done; }).slice(-1)[0];
    if (!pending) { return; }
    setUi({ recId: pending.id, pick: null });
    showResult();
  }
  function boot() {
    el.root.classList.toggle("is-lite", TC.perf.isLite());
    decorate();
    C.buildDeck(el.deck);
    TC.fx.init(el.fx);
    bindAdmin(); bindDeck(); bindUi();
    layout();
    phase("deck");
    el.root.classList.add("is-deal");
    later(1400, function () { el.root.classList.remove("is-deal"); });
    later(1800, prepareFoil);
    render();
    restorePending();
    try {
      if (document.fonts && document.fonts.load) {
        Promise.all([document.fonts.load("800 20px \"LW Display\""), document.fonts.load("700 16px \"LW Text\""), document.fonts.load("800 16px \"LW Text\"")])
          .then(layout, layout).then(prepareArt);
      } else { prepareArt(); }
    } catch (e) { layout(); prepareArt(); }
    TC.perf.onChange(applyLite);
    TC.perf.watch(DEBUG);
    if (DEBUG) {
      window.__tc = E.assign(E, { getState: function () { return state; }, phase: function () { return ui.phase; },
        progress: function () { return ui.surface ? ui.surface.progress() : 0; }, force: function (k) { force = k || ""; },
        isTest: isTest, isDemo: isDemo, today: today });
    }
  }
  boot();
})(window.TC = window.TC || {});

</script>
